[project]
name = "romania-mcp-server"
version = "0.2.0"
description = "Romanian company reports, ONRC search, financial trends, court checks, public contracts and local monitoring"
readme = "README.md"
license = "MIT"
authors = [{ name = "Robert Vind-Gardoș" }]
requires-python = ">=3.10"
keywords = ["mcp", "romania", "anaf", "cui", "bnr", "portal-just", "e-factura", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Romanian",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27,<1",
    "httpcore>=1.0,<2",
    "openpyxl>=3.1",
]

[project.urls]
Repository = "https://github.com/robyroro/romania-mcp"
Author = "https://stratagency.ro/en/robert-vind-gardos"

[project.scripts]
romania-mcp = "romania_mcp.server:main"
# so `uvx romania-mcp-server` works without --from
romania-mcp-server = "romania_mcp.server:main"
romania-mcp-data = "romania_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/romania_mcp"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
